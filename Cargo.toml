[package]
name = "mapping-macro-test"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "mapping-macro"]

[dependencies]
mapping-macro = { path = "./mapping-macro" }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[[example]]
name = "basic_usage"
